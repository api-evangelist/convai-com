naftiko: 1.0.0-alpha2
info:
  label: Convai Character API — Characters
  description: 'Convai Character API — Characters. 6 operations. Lead operation: Convai Create Character.
    Self-contained Naftiko capability covering one Convai business surface.'
  tags:
  - Convai
  - Characters
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    CONVAI_API_KEY: CONVAI_API_KEY
capability:
  consumes:
  - type: http
    namespace: characters-characters
    baseUri: https://api.convai.com
    description: Convai Character API — Characters business capability. Self-contained, no shared references.
    resources:
    - name: character-create
      path: /character/create
      operations:
      - name: createcharacter
        method: POST
        description: Convai Create Character
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: character-get
      path: /character/get
      operations:
      - name: getcharacter
        method: POST
        description: Convai Get Character
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: character-update
      path: /character/update
      operations:
      - name: updatecharacter
        method: POST
        description: Convai Update Character
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: character-list
      path: /character/list
      operations:
      - name: listcharacters
        method: POST
        description: Convai List Characters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: character-delete
      path: /character/delete
      operations:
      - name: deletecharacter
        method: POST
        description: Convai Delete Character
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: user-clone-character
      path: /user/clone_character
      operations:
      - name: clonecharacter
        method: POST
        description: Convai Clone Character
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    authentication:
      type: apikey
      key: CONVAI-API-KEY
      value: '{{env.CONVAI_API_KEY}}'
      placement: header
  exposes:
  - type: mcp
    namespace: characters-characters-mcp
    port: 9090
    transport: http
    description: MCP adapter for Convai Characters.
    tools:
    - name: convai-create-character
      description: Convai Create Character
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: characters-characters.createcharacter
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: convai-get-character
      description: Convai Get Character
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: characters-characters.getcharacter
      with:
        body: tools.body
    - name: convai-update-character
      description: Convai Update Character
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: characters-characters.updatecharacter
      with:
        body: tools.body
    - name: convai-list-characters
      description: Convai List Characters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: characters-characters.listcharacters
    - name: convai-delete-character
      description: Convai Delete Character
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: characters-characters.deletecharacter
      with:
        body: tools.body
    - name: convai-clone-character
      description: Convai Clone Character
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: characters-characters.clonecharacter
      with:
        body: tools.body
