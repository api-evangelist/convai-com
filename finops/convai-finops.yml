specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Convai
providerId: convai-com
created: '2026-05-25'
modified: '2026-05-25'
reconciled: false
tags:
  - FinOps
  - Cost Management
  - FOCUS
  - AI
  - Conversational AI
description: |
  FOCUS-aligned FinOps definition for Convai. Convai's billing surface is a
  tiered subscription with interaction-based metering and feature gating
  (Knowledge Bank, Custom LLM, Chat History, Evaluation by tier). FOCUS
  mapping below treats Convai as a usage-based AI service category billed
  monthly in USD; specific unit prices should be reconciled against
  convai.com/pricing before invoice modelling.
sources:
  - https://convai.com/pricing
  - https://docs.convai.com/api-docs/api-reference/core-api-reference
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Convai
serviceCategory: AI and Machine Learning
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  primaryUnit: interaction
  secondaryUnits:
    - tts_second
    - kb_document
    - session
focusColumns:
  ServiceName: Convai API
  ServiceCategory: AI and Machine Learning
  ProviderName: Convai
  PublisherName: Convai
  InvoiceIssuerName: Convai
  PricingCategory: Subscription
  PricingUnit: interaction
  BillingCurrency: USD
meters:
  - name: interactions
    unit: interaction
    aggregation: sum
    dimensions:
      - character
      - tier
      - language
  - name: tts_seconds
    unit: second
    aggregation: sum
    dimensions:
      - voice
      - language
  - name: knowledge_bank_documents
    unit: document
    aggregation: max
    dimensions:
      - character
  - name: evaluation_runs
    unit: run
    aggregation: sum
    dimensions:
      - character
      - tier
